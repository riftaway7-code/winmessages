[package]
name = "winmessages"
version = "0.1.0"
description = "native imessage for windows"
authors = ["riftaway7"]
edition = "2024"


[lib]
name = "winmessages_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
window-vibrancy = "0.8.1"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
regex = "1.13.1"
once_cell = "1.21.4"
tokio = { version = "1.54.1", features = ["full"] }
dirs = "7.0.0"
rustpush = { path = "../../vendor/rustpush", default-features = false, features = ["macos-validation-data", "local-adi"] }
keystore = { path = "../../vendor/rustpush/keystore" }
plist = "1.7"
sha2 = "0.10"
base64 = "0.21"
rustls = "0.23"
pretty_env_logger = "0.5"


[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true


[patch.crates-io]
quinn = { path = "../../vendor/rustpush/third_party/quinn/quinn" }
